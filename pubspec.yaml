name: application
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.2.14+17

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  crop_your_image: ^2.0.0
  firebase_analytics: ^12.4.6
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.2
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_staggered_grid_view: ^0.7.0
  http: ^1.6.0
  image_picker: ^1.2.3
  in_app_review: ^2.0.12
  in_app_update: ^5.0.0
  intl: 0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.0.0
  package_info_plus: ^10.2.1
  provider: ^6.1.5+1
  restart_app: ^1.9.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  shimmer_animation: ^2.2.2+1
  shorebird_code_push: ^2.0.7
  url_launcher: ^6.3.2
  vibration: ^3.2.0

dev_dependencies:
  build_runner: ^2.16.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.1

flutter_launcher_icons:
  image_path: 'assets/icon.png'
  android: true
  adaptive_icon_background: 'assets/icon.png'
  adaptive_icon_foreground: 'assets/icon.png'
  adaptive_icon_monochrome: 'assets/monochrome.png'
  ios: true
  image_path_ios_tinted_grayscale: 'assets/grayscale.png'
  desaturate_tinted_to_grayscale_ios: true
  web:
    generate: true
    image_path: 'assets/light_icon.png'
  windows:
    generate: true
    image_path: 'assets/light_icon.png'
    icon_size: 256
  macos:
    generate: true
    image_path: 'assets/light_icon.png'
  linux:
    generate: true
    image_path: 'assets/light_icon.png'

flutter_native_splash:
  android: true
  ios: true
  color: "#ffffff"
  color_dark: "#000000"
  image: 'assets/dark_icon_padding.png'
  image_dark: 'assets/light_icon_padding.png'
  android_12:
    color: "#ffffff"
    color_dark: "#000000"
    image: 'assets/dark_icon_padding.png'
    image_dark: 'assets/light_icon_padding.png'

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/light_icon.png
    - assets/dark_icon.png
    - shorebird.yaml
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/satoshi/Satoshi-Light.ttf
        - asset: assets/fonts/satoshi/Satoshi-Regular.ttf
        - asset: assets/fonts/satoshi/Satoshi-Medium.ttf
        - asset: assets/fonts/satoshi/Satoshi-Bold.ttf
        - asset: assets/fonts/satoshi/Satoshi-Italic.ttf
        - asset: assets/fonts/satoshi/Satoshi-BoldItalic.ttf
